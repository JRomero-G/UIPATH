#RECOLECTOR DE INFIMAS
name: Scraper de Gestorex Recoleccion Temporal

on:
  schedule:
    # Horario Ecuador (UTC-5): domingos, cada 2 horas, de 8:00am a 4:00pm
    # 8am -> 13 UTC | 10am -> 15 UTC | 12pm -> 17 UTC | 2pm -> 19 UTC | 4pm -> 21 UTC
    - cron: "0 13,15,17,19,21 * * 0" # 0 = domingo
  workflow_dispatch: # Permite ejecución manual

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium chromium-driver

      - name: Instalar dependencias Python
        run: |
          pip install -r requirements.txt

      - name: Ejecutar Recoleccion
        run: python main_Recoleccion.py
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DATABASE: ${{ secrets.DATABASE }}
          CREDENTIALS_GEMINI: ${{ secrets.CREDENTIALS_GEMINI }}
          RENDER_CRENDENTIALS_JSON: ${{ secrets.RENDER_CRENDENTIALS_JSON }}
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
          TMPDIR: /tmp
          TMP: /tmp
          PYTHONUNBUFFERED: 1
